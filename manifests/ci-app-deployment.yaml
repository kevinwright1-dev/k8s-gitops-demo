apiVersion: apps/v1
kind: Deployment
metadata:
  name: ci-app
  namespace: default
  labels:
    app: ci-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: ci-app
  template:
    metadata:
      labels:
        app: ci-app
    spec:
      containers:
        - name: ci-app
          image: ghcr.io/kevinwright1-dev/ci-cd-pipeline-demo:latest
          ports:
            - containerPort: 5000
---
apiVersion: v1
kind: Service
metadata:
  name: ci-app-service
  namespace: default
spec:
  type: NodePort
  selector:
    app: ci-app
  ports:
    - port: 5000
      targetPort: 5000